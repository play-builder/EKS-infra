name: terraform-drift

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-drift-${{ matrix.root }}-${{ vars.AWS_REGION }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { root: environments/dev/01-network, backend: environments/dev/config/network.tfbackend }
          - { root: environments/dev/02-eks, backend: environments/dev/config/eks.tfbackend }
          - { root: environments/dev/03-platform, backend: environments/dev/config/platform.tfbackend }
          - { root: environments/dev/04-workloads/argocd, backend: environments/dev/config/argocd.tfbackend }
          - { root: environments/prod/01-network, backend: environments/prod/config/network.tfbackend }
          - { root: environments/prod/02-eks, backend: environments/prod/config/eks.tfbackend }
          - { root: environments/prod/03-platform, backend: environments/prod/config/platform.tfbackend }
          - { root: environments/prod/04-workloads/argocd, backend: environments/prod/config/argocd.tfbackend }
          - { root: environments/prod/03-database, backend: environments/prod/config/database.tfbackend }
          - { root: environments/recovery/03-database, backend: environments/recovery/config/database.tfbackend }
    env:
      TF_ROOT: ${{ matrix.root }}
      TF_BACKEND: ${{ matrix.backend }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BACKEND_BUCKET: ${{ vars.STATE_BUCKET_NAME }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.0"
      - name: Require dedicated read-only identity and root inputs
        id: root-inputs
        env:
          DRIFT_ROLE: ${{ secrets.TERRAFORM_DRIFT_ROLE_ARN }}
          TERRAFORM_DRIFT_INPUTS_JSON: ${{ secrets.TERRAFORM_DRIFT_INPUTS_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DRIFT_ROLE" ]] || { echo DRIFT_INPUTS_REQUIRED >&2; exit 64; }
          python3 scripts/lib/project-terraform-inputs.py drift
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.TERRAFORM_DRIFT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read-only drift plan
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text --region "$AWS_REGION")" == "$AWS_ACCOUNT_ID" ]] || { echo DRIFT_ACCOUNT_MISMATCH >&2; exit 1; }
          mkdir -p evidence/terraform-drift
          bash scripts/terraform-drift-check.sh "$GITHUB_WORKSPACE/$TF_ROOT" "$GITHUB_WORKSPACE/$TF_BACKEND" "$GITHUB_WORKSPACE/evidence/terraform-drift/current"
      - name: Upload redacted drift decision only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-drift-${{ strategy.job-index }}
          path: evidence/terraform-drift/current/drift.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove ephemeral root inputs
        if: ${{ always() && steps.root-inputs.outputs.created == 'true' }}
        run: python3 scripts/lib/project-terraform-inputs.py cleanup
