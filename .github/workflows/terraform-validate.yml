name: terraform-validate

on:
  workflow_dispatch:
    inputs:
      terraform_root:
        required: true
        type: string
      backend_config:
        required: true
        type: string
      account_id:
        required: true
        type: string
      backend_bucket:
        required: true
        type: string
      backend_key:
        required: true
        type: string
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

  # Plan jobs deliberately cannot assume AWS identities or apply infrastructure.

jobs:
  reviewed-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.0"
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d235d23a5528890a34d9a8747a
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create reviewed plan artifact
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/create-saved-plan.sh "${{ inputs.terraform_root }}" "${{ inputs.backend_config }}" plan-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-terraform-plan
          path: plan-artifact

  reviewed-plan-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-terraform-plan
          path: plan-artifact
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.0"
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d235d23a5528890a34d9a8747a
        with:
          role-to-assume: ${{ secrets.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify reviewed saved plan before apply
        run: bash scripts/verify-saved-plan.sh plan-artifact "${{ inputs.terraform_root }}" "${{ inputs.account_id }}" "${{ vars.AWS_REGION }}" "${{ inputs.backend_bucket }}" "${{ inputs.backend_key }}" s3-native-lockfile "$GITHUB_SHA"
      - name: Apply the verified binary plan
        run: terraform -chdir="${{ inputs.terraform_root }}" apply plan-artifact/tfplan

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify course repository contracts
        run: bash tests/run-contract-tests.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"

      - name: Check repository formatting
        run: terraform fmt -check -recursive

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run repository TFLint gate
        run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          skip-dirs: vendor
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Install Conftest
        env:
          CONFTEST_VERSION: "0.69.0"
          CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
        run: |
          curl -fsSL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/conftest.tar.gz
          echo "${CONFTEST_SHA256}  /tmp/conftest.tar.gz" | sha256sum --check
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest

      - name: Verify the lightweight Conftest policy
        run: conftest verify --policy policy/terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/state-backend
          - terraform/iam-github-oidc
          - terraform/github-governance
          - environments/dev/01-network
          - environments/dev/02-eks
          - environments/dev/03-platform
          - environments/dev/04-workloads/argocd
          - environments/prod/01-network
          - environments/prod/02-eks
          - environments/prod/03-platform
          - environments/prod/04-workloads/argocd

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
