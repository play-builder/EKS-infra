name: terraform-validate

on:
  workflow_dispatch:
    inputs:
      terraform_root:
        required: true
        type: choice
        options:
          - environments/dev/01-network
          - environments/dev/02-eks
          - environments/dev/03-platform
          - environments/dev/04-workloads/argocd
          - environments/prod/01-network
          - environments/prod/02-eks
          - environments/prod/03-platform
          - environments/prod/04-workloads/argocd
      backend_config:
        required: true
        type: choice
        options:
          - environments/dev/config/network.tfbackend
          - environments/dev/config/eks.tfbackend
          - environments/dev/config/platform.tfbackend
          - environments/dev/config/argocd.tfbackend
          - environments/prod/config/network.tfbackend
          - environments/prod/config/eks.tfbackend
          - environments/prod/config/platform.tfbackend
          - environments/prod/config/argocd.tfbackend
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

  # Repository access stays read-only; AWS mutation is isolated to the protected apply job.

jobs:
  reviewed-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.0"
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d235d23a5528890a34d9a8747a
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create reviewed plan artifact
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BACKEND_BUCKET: ${{ vars.STATE_BUCKET_NAME }}
          PLAN_REQUEST_IDENTITY: ${{ github.triggering_actor }}
          PLAN_RUN_ID: ${{ github.run_id }}
        run: bash "$GITHUB_WORKSPACE/scripts/create-saved-plan.sh" "$GITHUB_WORKSPACE/${{ inputs.terraform_root }}" "$GITHUB_WORKSPACE/${{ inputs.backend_config }}" "$GITHUB_WORKSPACE/plan-artifact" apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-terraform-plan
          path: ${{ github.workspace }}/plan-artifact
          retention-days: 1

  reviewed-plan-apply:
    if: github.event_name == 'workflow_dispatch'
    needs: reviewed-plan
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply-${{ vars.AWS_REGION }}-${{ inputs.terraform_root }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-terraform-plan
          path: ${{ github.workspace }}/plan-artifact
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.0"
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d235d23a5528890a34d9a8747a
        with:
          role-to-assume: ${{ secrets.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Bind protected environment approval history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/approval-history.json"
          bash "$GITHUB_WORKSPACE/scripts/bind-saved-plan-approval.sh" "$GITHUB_WORKSPACE/plan-artifact" "$RUNNER_TEMP/approval-history.json" production "$GITHUB_TRIGGERING_ACTOR" "$GITHUB_RUN_ID"
      - name: Verify reviewed saved plan before apply
        run: |
          LIVE_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_KEY=$(jq -r '.backendKey' "$GITHUB_WORKSPACE/plan-artifact/plan-identity.json")
          bash "$GITHUB_WORKSPACE/scripts/verify-saved-plan.sh" "$GITHUB_WORKSPACE/plan-artifact" "${{ inputs.terraform_root }}" "$LIVE_ACCOUNT_ID" "${{ vars.AWS_REGION }}" "${{ vars.STATE_BUCKET_NAME }}" "$BACKEND_KEY" s3-native-lockfile "$GITHUB_SHA" "$GITHUB_TRIGGERING_ACTOR" "$GITHUB_RUN_ID" apply
      - name: Apply the verified binary plan
        run: terraform -chdir="$GITHUB_WORKSPACE/${{ inputs.terraform_root }}" apply "$GITHUB_WORKSPACE/plan-artifact/tfplan"

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify course repository contracts
        run: bash tests/run-contract-tests.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"

      - name: Check repository formatting
        run: terraform fmt -check -recursive

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run repository TFLint gate
        run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          skip-dirs: vendor
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Install Conftest
        env:
          CONFTEST_VERSION: "0.69.0"
          CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
        run: |
          curl -fsSL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/conftest.tar.gz
          echo "${CONFTEST_SHA256}  /tmp/conftest.tar.gz" | sha256sum --check
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest

      - name: Verify the lightweight Conftest policy
        run: conftest verify --policy policy/terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/state-backend
          - terraform/iam-github-oidc
          - terraform/github-governance
          - environments/dev/01-network
          - environments/dev/02-eks
          - environments/dev/03-platform
          - environments/dev/04-workloads/argocd
          - environments/prod/01-network
          - environments/prod/02-eks
          - environments/prod/03-platform
          - environments/prod/04-workloads/argocd

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
