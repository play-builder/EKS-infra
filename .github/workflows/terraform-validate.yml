name: terraform-validate

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.9"

      - name: Check repository formatting
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/iam-github-oidc
          - environments/dev/01-network
          - environments/dev/02-eks
          - environments/dev/03-platform
          - environments/dev/04-workloads/argocd
          - environments/prod/01-network
          - environments/prod/02-eks
          - environments/prod/03-platform
          - environments/prod/04-workloads/argocd

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.9"

      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
