misconfigurations:
  - id: AWS-0104
    paths: ["modules/compute/bastion/main.tf"]
    statement: "Sandbox bastion requires outbound HTTPS; ingress remains restricted."
    expired_at: 2027-09-02
  - id: AWS-0104
    paths: ["modules/compute/operator-access/main.tf"]
    statement: "The private operator requires outbound HTTPS for SSM, STS, EKS, and checksum-verified tool bootstrap; it has no inbound rule, public IP, or SSH key. Replace this exception with private service endpoints and a golden AMI before the expiry date."
    expired_at: 2026-12-05
  - id: AWS-0039
    paths: ["modules/eks/cluster/main.tf"]
    statement: "EKS 1.36 encrypts Kubernetes API data at rest by default; a customer-managed KMS key is outside the platform cost boundary."
    expired_at: 2027-09-02
  - id: AWS-0040
    paths: ["modules/eks/cluster/main.tf"]
    statement: "The platform uses a public API endpoint restricted by public_access_cidrs for operator workstations."
    expired_at: 2027-09-02
  - id: AWS-0164
    paths: ["modules/networking/vpc/main.tf"]
    statement: "Public subnets intentionally host internet-facing load balancers; worker nodes use private subnets."
    expired_at: 2027-09-02
  - id: AWS-0132
    paths: ["modules/bootstrap/state-backend/main.tf"]
    statement: "The disposable platform backend uses SSE-S3 to avoid a persistent KMS key charge."
    expired_at: 2027-09-02
  - id: AWS-0032
    paths: ["environments/network/02-registry/main.tf"]
    statement: "The pull policy uses Principal * only together with an aws:PrincipalOrgID condition, so it grants read access to member accounts of this Organization and nothing public; dev/prod clusters pull from the network account registry."
    expired_at: 2027-09-07
  - id: GIT-0001
    paths: ["environments/network/03-github-governance/main.tf"]
    statement: "The public visibility is intentional because teams fork this platform repository; delivery controls and secret scanning remain independently enforced."
    expired_at: 2027-09-03
  - id: GIT-0003
    paths: ["environments/network/03-github-governance/main.tf"]
    statement: "Alerts are managed by the dedicated github_repository_vulnerability_alerts resource; Trivy only inspects the github_repository block."
    expired_at: 2027-09-03
